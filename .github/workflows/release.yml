name: Create Releases and Build Docker images

on:
  push:
    branches:
      - 'master'
  # Allows us to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      fresh_build:
        description: Rebuild all layers to pick up available package fixes
        type: boolean
        default: true
  workflow_call:
    inputs:
      fresh_build:
        description: Pull base images and rebuild all layers to pick up available package fixes
        type: boolean
        default: false
      ref:
        description: Commit to check out and build
        type: string
        default: ''
      cve_list:
        description: CVEs targeted by an automatic rebuild; publication requires verified improvement
        type: string
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: httpd-image-publication
  cancel-in-progress: false

jobs:
  create-release-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record source commit
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Test Scout automation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Load .env file
        run: |
          set -a
          source .env
          set +a
          echo "APACHE_VERSION=$APACHE_VERSION" >> $GITHUB_ENV
          echo "APACHE_VERSION_MAJOR=$APACHE_VERSION_MAJOR" >> $GITHUB_ENV
          echo "ALPINE_VERSION=$ALPINE_VERSION" >> $GITHUB_ENV
          echo "IMAGE_TAG_PREFIX=$APACHE_VERSION" >> $GITHUB_ENV

      - name: Debug print
        run: |
          echo "APACHE_VERSION=$APACHE_VERSION"
          echo "APACHE_VERSION_MAJOR=$APACHE_VERSION_MAJOR"
          echo "ALPINE_VERSION=$ALPINE_VERSION"

      - name: Setup GitHub CLI
        run: |
          gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.0.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Generate build timestamp
        id: build-timestamp
        run: echo "BUILD_TIMESTAMP=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Push candidate Docker images
        id: push-httpd
        uses: docker/build-push-action@v7.0.0
        with:
          push: true
          pull: true
          no-cache: ${{ inputs.fresh_build || false }}
          provenance: mode=max
          sbom: true
          attests: type=sbom,generator=docker/scout
          platforms: linux/amd64,linux/arm64
          tags: |
            mxmd/httpd:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            APACHE_VERSION=${{ env.APACHE_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          file: ./Dockerfile

      - name: Push candidate hardened Docker images
        id: push-httpd-hardened
        uses: docker/build-push-action@v7.0.0
        with:
          push: true
          pull: true
          no-cache: ${{ inputs.fresh_build || false }}
          provenance: mode=max
          sbom: true
          attests: type=sbom,generator=docker/scout
          platforms: linux/amd64,linux/arm64
          tags: |
            mxmd/httpd:candidate-${{ github.run_id }}-${{ github.run_attempt }}-hardened
          build-args: |
            APACHE_VERSION=${{ env.APACHE_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          file: ./Dockerfile.hardened

      - name: Push candidate hardened nonroot Docker images
        id: push-httpd-hardened-nonroot
        uses: docker/build-push-action@v7.0.0
        with:
          push: true
          pull: true
          no-cache: ${{ inputs.fresh_build || false }}
          provenance: mode=max
          sbom: true
          attests: type=sbom,generator=docker/scout
          platforms: linux/amd64,linux/arm64
          tags: |
            mxmd/httpd:candidate-${{ github.run_id }}-${{ github.run_attempt }}-hardened-nonroot
          build-args: |
            APACHE_VERSION=${{ env.APACHE_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          file: ./Dockerfile.hardened-nonroot

      - name: Install Docker Scout for verification
        if: inputs.cve_list != ''
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/docker/scout-cli/v1.20.3/install.sh \
            --output "$RUNNER_TEMP/install-scout.sh"
          sh "$RUNNER_TEMP/install-scout.sh" -b "$HOME/.docker/cli-plugins" v1.20.3

      - name: Verify candidate improvements on both architectures
        if: inputs.cve_list != ''
        id: verify
        env:
          CANDIDATE_DIGESTS: >-
            {"base":"${{ steps.push-httpd.outputs.digest }}",
             "hardened":"${{ steps.push-httpd-hardened.outputs.digest }}",
             "hardened-nonroot":"${{ steps.push-httpd-hardened-nonroot.outputs.digest }}"}
        run: python3 .github/scripts/verify_docker_images.py

      - name: Save candidate verification reports
        if: always() && inputs.cve_list != ''
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scout-verification
          path: scout-verification/
          retention-days: 30
          if-no-files-found: warn

      - name: Promote candidate digests to public tags
        env:
          BASE_DIGEST: ${{ steps.push-httpd.outputs.digest }}
          HARDENED_DIGEST: ${{ steps.push-httpd-hardened.outputs.digest }}
          NONROOT_DIGEST: ${{ steps.push-httpd-hardened-nonroot.outputs.digest }}
        run: |
          promote() {
            local digest="$1" suffix="$2"
            docker buildx imagetools create \
              --tag "mxmd/httpd:${APACHE_VERSION}${suffix}" \
              --tag "mxmd/httpd:${APACHE_VERSION_MAJOR}${suffix}" \
              --tag "mxmd/httpd:${APACHE_VERSION}${suffix}-${BUILD_TIMESTAMP}" \
              --tag "mxmd/httpd:${APACHE_VERSION_MAJOR}${suffix}-${BUILD_TIMESTAMP}" \
              "mxmd/httpd@${digest}"
          }
          promote "$BASE_DIGEST" ""
          promote "$HARDENED_DIGEST" "-hardened"
          promote "$NONROOT_DIGEST" "-hardened-nonroot"

      - name: Create or update release after publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOUT_REBUILD: ${{ inputs.cve_list != '' }}
          VERIFIED_CVES: ${{ steps.verify.outputs.verified_cves }}
          REMAINING_CVES: ${{ steps.verify.outputs.remaining_cves }}
        run: |
          TAG_NAME="httpd-${APACHE_VERSION}"
          DOCKER_HUB_LINK="https://hub.docker.com/r/mxmd/httpd/tags?page=1&name=${APACHE_VERSION}"
          if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --target "$SOURCE_SHA" \
              --title "Apache ${APACHE_VERSION} release" \
              --notes "Release of Docker image for Apache ${APACHE_VERSION}. [View on Docker Hub]($DOCKER_HUB_LINK)"
          fi
          if [[ "$SCOUT_REBUILD" == "true" ]]; then
            gh release view "$TAG_NAME" --json body -q .body > "$RUNNER_TEMP/release-notes.md"
            {
              printf '\n**Verified Scout rebuild (%s)**\n\n' "$(date -u +%Y-%m-%d)"
              printf 'CVEs resolved across all variants and architectures: %s\n\n' "${VERIFIED_CVES:-none}"
              printf 'Remaining high/critical CVEs: %s\n\n' "${REMAINING_CVES:-none}"
              printf '[Before/after reports](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            } >> "$RUNNER_TEMP/release-notes.md"
            gh release edit "$TAG_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Publish digest tag on GitHub
        if: ${{ steps.push-httpd.outputs.digest != '' }}
        env:
          IMAGE_DIGEST: ${{ steps.push-httpd.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIGEST_HEX="${IMAGE_DIGEST#sha256:}"
          DIGEST_TAG="${IMAGE_TAG_PREFIX}-sha256-${DIGEST_HEX}"
          IMAGE_REF="mxmd/httpd:${IMAGE_TAG_PREFIX}"
          IMAGE_MAJOR_REF="mxmd/httpd:${APACHE_VERSION_MAJOR}"
          IMAGE_TIMESTAMP_REF="mxmd/httpd:${IMAGE_TAG_PREFIX}-${BUILD_TIMESTAMP}"
          IMAGE_MAJOR_TIMESTAMP_REF="mxmd/httpd:${APACHE_VERSION_MAJOR}-${BUILD_TIMESTAMP}"
          DOCKER_HUB_LINK="https://hub.docker.com/r/mxmd/httpd/tags?page=1&name=${IMAGE_TAG_PREFIX}"
          RELEASE_NOTES=$(cat <<EOF
          Immutable Docker manifest digest for ${IMAGE_REF}

          Docker digest: \`${IMAGE_DIGEST}\`
          Published tags:
          - \`${IMAGE_REF}\`
          - \`${IMAGE_MAJOR_REF}\`
          - \`${IMAGE_TIMESTAMP_REF}\`
          - \`${IMAGE_MAJOR_TIMESTAMP_REF}\`
          Digest references:
          - \`${IMAGE_REF}@${IMAGE_DIGEST}\`
          - \`${IMAGE_MAJOR_REF}@${IMAGE_DIGEST}\`
          - \`${IMAGE_TIMESTAMP_REF}@${IMAGE_DIGEST}\`
          - \`${IMAGE_MAJOR_TIMESTAMP_REF}@${IMAGE_DIGEST}\`
          Docker Hub tags: ${DOCKER_HUB_LINK}
          EOF
          )

          if ! gh release view "${DIGEST_TAG}" > /dev/null 2>&1; then
            gh release create "${DIGEST_TAG}" \
              --target "${SOURCE_SHA}" \
              --title "Docker digest ${DIGEST_TAG}" \
              --notes "${RELEASE_NOTES}"
          fi

      - name: Publish hardened digest tag on GitHub
        if: ${{ steps.push-httpd-hardened.outputs.digest != '' }}
        env:
          IMAGE_DIGEST: ${{ steps.push-httpd-hardened.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIGEST_HEX="${IMAGE_DIGEST#sha256:}"
          DIGEST_TAG="${IMAGE_TAG_PREFIX}-hardened-sha256-${DIGEST_HEX}"
          IMAGE_REF="mxmd/httpd:${IMAGE_TAG_PREFIX}-hardened"
          IMAGE_MAJOR_REF="mxmd/httpd:${APACHE_VERSION_MAJOR}-hardened"
          IMAGE_TIMESTAMP_REF="mxmd/httpd:${IMAGE_TAG_PREFIX}-hardened-${BUILD_TIMESTAMP}"
          IMAGE_MAJOR_TIMESTAMP_REF="mxmd/httpd:${APACHE_VERSION_MAJOR}-hardened-${BUILD_TIMESTAMP}"
          DOCKER_HUB_LINK="https://hub.docker.com/r/mxmd/httpd/tags?page=1&name=${IMAGE_TAG_PREFIX}-hardened"
          RELEASE_NOTES=$(cat <<EOF
          Immutable Docker manifest digest for ${IMAGE_REF}

          Docker digest: \`${IMAGE_DIGEST}\`
          Published tags:
          - \`${IMAGE_REF}\`
          - \`${IMAGE_MAJOR_REF}\`
          - \`${IMAGE_TIMESTAMP_REF}\`
          - \`${IMAGE_MAJOR_TIMESTAMP_REF}\`
          Digest references:
          - \`${IMAGE_REF}@${IMAGE_DIGEST}\`
          - \`${IMAGE_MAJOR_REF}@${IMAGE_DIGEST}\`
          - \`${IMAGE_TIMESTAMP_REF}@${IMAGE_DIGEST}\`
          - \`${IMAGE_MAJOR_TIMESTAMP_REF}@${IMAGE_DIGEST}\`
          Docker Hub tags: ${DOCKER_HUB_LINK}
          EOF
          )

          if ! gh release view "${DIGEST_TAG}" > /dev/null 2>&1; then
            gh release create "${DIGEST_TAG}" \
              --target "${SOURCE_SHA}" \
              --title "Docker digest ${DIGEST_TAG}" \
              --notes "${RELEASE_NOTES}"
          fi

      - name: Publish hardened nonroot digest tag on GitHub
        if: ${{ steps.push-httpd-hardened-nonroot.outputs.digest != '' }}
        env:
          IMAGE_DIGEST: ${{ steps.push-httpd-hardened-nonroot.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIGEST_HEX="${IMAGE_DIGEST#sha256:}"
          DIGEST_TAG="${IMAGE_TAG_PREFIX}-hardened-nonroot-sha256-${DIGEST_HEX}"
          IMAGE_REF="mxmd/httpd:${IMAGE_TAG_PREFIX}-hardened-nonroot"
          IMAGE_MAJOR_REF="mxmd/httpd:${APACHE_VERSION_MAJOR}-hardened-nonroot"
          IMAGE_TIMESTAMP_REF="mxmd/httpd:${IMAGE_TAG_PREFIX}-hardened-nonroot-${BUILD_TIMESTAMP}"
          IMAGE_MAJOR_TIMESTAMP_REF="mxmd/httpd:${APACHE_VERSION_MAJOR}-hardened-nonroot-${BUILD_TIMESTAMP}"
          DOCKER_HUB_LINK="https://hub.docker.com/r/mxmd/httpd/tags?page=1&name=${IMAGE_TAG_PREFIX}-hardened-nonroot"
          RELEASE_NOTES=$(cat <<EOF
          Immutable Docker manifest digest for ${IMAGE_REF}

          Docker digest: \`${IMAGE_DIGEST}\`
          Published tags:
          - \`${IMAGE_REF}\`
          - \`${IMAGE_MAJOR_REF}\`
          - \`${IMAGE_TIMESTAMP_REF}\`
          - \`${IMAGE_MAJOR_TIMESTAMP_REF}\`
          Digest references:
          - \`${IMAGE_REF}@${IMAGE_DIGEST}\`
          - \`${IMAGE_MAJOR_REF}@${IMAGE_DIGEST}\`
          - \`${IMAGE_TIMESTAMP_REF}@${IMAGE_DIGEST}\`
          - \`${IMAGE_MAJOR_TIMESTAMP_REF}@${IMAGE_DIGEST}\`
          Docker Hub tags: ${DOCKER_HUB_LINK}
          EOF
          )

          if ! gh release view "${DIGEST_TAG}" > /dev/null 2>&1; then
            gh release create "${DIGEST_TAG}" \
              --target "${SOURCE_SHA}" \
              --title "Docker digest ${DIGEST_TAG}" \
              --notes "${RELEASE_NOTES}"
          fi
